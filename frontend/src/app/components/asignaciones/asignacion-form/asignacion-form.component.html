<div class="container">
  <h2>Asignaciones</h2>
  <p class="page-subtitle">Asigna materias a estudiantes y profesores.</p>

  <p class="mensaje" *ngIf="mensaje">{{ mensaje }}</p>
  <p class="error" *ngIf="error">{{ error }}</p>

  <section class="card bloque">
    <h3>Asignar materia a estudiante</h3>

    <div class="fila">
      <select [(ngModel)]="estudianteSeleccionado" (ngModelChange)="cargarMateriasDelEstudiante()">
        <option [ngValue]="null">Selecciona estudiante</option>
        <option *ngFor="let e of estudiantes" [ngValue]="e.id">{{ e.nombre }} {{ e.apellido }}</option>
      </select>

      <select [(ngModel)]="materiaParaEstudiante">
        <option [ngValue]="null">Selecciona materia</option>
        <option *ngFor="let m of materias" [ngValue]="m.id">{{ m.nombre }}</option>
      </select>

      <button class="btn btn-primary" (click)="asignarMateriaAEstudiante()">Asignar</button>
    </div>

    <ul *ngIf="materiasDelEstudiante.length > 0" class="lista-materias">
      <li *ngFor="let m of materiasDelEstudiante">
        {{ m.nombre }}
        <button class="btn btn-small btn-danger" (click)="quitarAsignacionEstudiante(m.id)">Quitar</button>
      </li>
    </ul>
    <p class="ayuda" *ngIf="estudianteSeleccionado && materiasDelEstudiante.length === 0">
      Este estudiante no tiene materias asignadas.
    </p>
  </section>

  <section class="card bloque">
    <h3>Asignar materia a profesor</h3>

    <div class="fila">
      <select [(ngModel)]="profesorSeleccionado" (ngModelChange)="cargarMateriasDelProfesor()">
        <option [ngValue]="null">Selecciona profesor</option>
        <option *ngFor="let p of profesores" [ngValue]="p.id">{{ p.nombre }} {{ p.apellido }}</option>
      </select>

      <select [(ngModel)]="materiaParaProfesor">
        <option [ngValue]="null">Selecciona materia</option>
        <option *ngFor="let m of materias" [ngValue]="m.id">{{ m.nombre }}</option>
      </select>

      <button class="btn btn-primary" (click)="asignarMateriaAProfesor()">Asignar</button>
    </div>

    <ul *ngIf="materiasDelProfesor.length > 0" class="lista-materias">
      <li *ngFor="let m of materiasDelProfesor">
        {{ m.nombre }}
        <button class="btn btn-small btn-danger" (click)="quitarAsignacionProfesor(m.id)">Quitar</button>
      </li>
    </ul>
    <p class="ayuda" *ngIf="profesorSeleccionado && materiasDelProfesor.length === 0">
      Este profesor no tiene materias asignadas.
    </p>
  </section>
</div>
