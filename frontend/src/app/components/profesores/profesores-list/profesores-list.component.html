<div class="container">
  <div class="header">
    <div>
      <h2>Profesores</h2>
      <p class="page-subtitle">Gestiona la información de los profesores registrados.</p>
    </div>
    <button class="btn btn-primary" (click)="nuevoProfesor()">Nuevo profesor</button>
  </div>

  <p *ngIf="cargando">Cargando...</p>
  <p class="error" *ngIf="error">{{ error }}</p>

  <div class="card" *ngIf="!cargando && profesores.length > 0">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Email</th>
          <th>Especialidad</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let p of profesores">
          <td class="col-id">{{ p.id }}</td>
          <td>{{ p.nombre }}</td>
          <td>{{ p.apellido }}</td>
          <td>{{ p.email }}</td>
          <td>{{ p.especialidad }}</td>
          <td class="col-acciones">
            <button class="btn btn-small" (click)="editarProfesor(p.id)">Editar</button>
            <button class="btn btn-small btn-danger" (click)="eliminarProfesor(p.id)">Eliminar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="card estado-vacio" *ngIf="!cargando && profesores.length === 0 && !error">
    <p>No hay profesores registrados todavía.</p>
    <button class="btn btn-primary" (click)="nuevoProfesor()">Registrar el primero</button>
  </div>
</div>
